<section class="main__form" id="form">
  <div class="container">
    <div class="main__form-wrapper">
      <h2 class="title main__form-title">Запись на консультацию</h2>
      <p class="main__form-description text-m">
        Заполните форму, чтобы записаться на консультацию. Укажите свои контактные данные и предпочтения по стилю
        интерьера.
      </p>

      <form action="/files/mail.php" method="POST" class="form" id="consultation-form">
        <div class="form__row">
          <div class="form__group">
            <label for="name" class="form__label">Ваше имя</label>
            <input type="text" name="name" id="name" class="form__input" placeholder="Имя" minlength="2" maxlength="20"
              required autocomplete="name" aria-describedby="nameError" aria-invalid="false">
            <span class="form__error" id="nameError" aria-live="polite"></span>
          </div>

          <div class="form__group">
            <label for="phone" class="form__label">Ваш номер телефона</label>
            <input type="tel" name="phone" id="phone" class="form__input" placeholder="+7 (___) ___-__-__" required
              autocomplete="tel" inputmode="tel" aria-describedby="phoneError" aria-invalid="false">
            <span class="form__error" id="phoneError" aria-live="polite"></span>
          </div>
        </div>

        <div class="form__group form__group--full">
          <label for="comment" class="form__label">Предпочтения по стилю интерьера</label>
          <textarea name="comment" id="comment" class="form__input form__textarea" placeholder="Комментарий"></textarea>
        </div>

        <input type="text" name="company" class="visually-hidden" tabindex="-1" autocomplete="off">
        <input type="hidden" name="form_ts" value="">

        <button type="submit" class="button btn-d form__button" title="Отправить заявку"
          aria-label="Отправить заявку на консультацию">Записаться</button>
        <div class="form__status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>
